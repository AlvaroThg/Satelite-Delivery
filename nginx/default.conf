# Configuración de Servidor Web (Nginx) para Laravel

server {
    # El servidor escuchará en el puerto 80 (HTTP)
    listen 80;
    
    # Directorio base de los archivos públicos (la carpeta public de Laravel)
    root /var/www/html/public;
    
    # Orden de precedencia en el que se buscan los archivos
    index index.php index.html;

    # Bloque principal de reescritura de URLs
    location / {
        # Si el archivo/carpeta no existe, redirige todo al index.php de Laravel
        # Esto es lo que permite tener Single Page Applications (Rutas "limpias")
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloque encargado de ejecutar y procesar los archivos PHP
    location ~ \.php$ {
        # Separa la ruta path del script para FastCGI
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Redirige todo al contenedor PHP (Fastcgi Process Manager) en el puerto 9000
        # En Docker Compose: backend-php-service:9000 (nombre del servicio en la red personalizada)  
        # En Kubernetes: backend-php-service:9000 (nombre del Service dentro del cluster)
        # Ambos entornos resuelven este nombre automáticamente gracias a DNS
        fastcgi_pass backend-php-service:9000;
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Deniega el acceso a ficheros ocultos (ej. .env o .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
